<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Smart Malaysia Travel</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center}
.login-container{background:white;padding:35px;border-radius:12px;width:350px;max-width:calc(100% - 50px);box-shadow:0 5px 20px rgba(0,0,0,.1)}
h2{text-align:center;color:#1e293b}label{display:block;margin-top:15px}input{width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;margin-top:20px;cursor:pointer}
.back-link{display:block;text-align:center;margin-top:18px}#error-message{color:#dc2626;text-align:center}
</style></head><body>
<div class="login-container"><h2>Admin Login</h2>
<form id="admin-login-form"><label for="admin-email">Admin Email</label><input type="email" id="admin-email" required autocomplete="username">
<label for="admin-password">Password</label><input type="password" id="admin-password" required autocomplete="current-password">
<button type="submit" id="login-button">Login as Admin</button></form>
<p id="error-message" role="alert"></p><a href="/" class="back-link">Back to Home</a></div>
<script>
document.getElementById('admin-login-form').addEventListener('submit',async function(event){event.preventDefault();
const email=document.getElementById('admin-email').value,password=document.getElementById('admin-password').value;
const errorMessage=document.getElementById('error-message'),loginButton=document.getElementById('login-button');
errorMessage.textContent='';loginButton.disabled=true;
try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email,password})});
const data=await response.json();if(!response.ok||!data.success){errorMessage.textContent=data.error||'Admin login failed.';return;}
window.location.href='/admin/dashboard';}catch(error){errorMessage.textContent='Unable to connect to the server.';}finally{loginButton.disabled=false;}});
</script></body></html>
